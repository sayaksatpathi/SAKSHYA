name: Deploy to Hugging Face Space

# Every push to main (and manual runs) mirrors this repo to the Hugging Face
# Space, which then rebuilds and goes live automatically.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        if: ${{ secrets.HF_TOKEN != '' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions"
          # Force-push this repo's current commit to the Space's main branch.
          git push --force "https://Sayak-Satpathi:${HF_TOKEN}@huggingface.co/spaces/Sayak-Satpathi/sakshya-demo" HEAD:main

      - name: Skip deploy if token is missing
        if: ${{ secrets.HF_TOKEN == '' }}
        run: echo "::warning::HF_TOKEN is not set. Skipping Hugging Face deploy."
