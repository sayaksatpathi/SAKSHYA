name: Deploy to Hugging Face Space

# Every push to main (and manual runs) mirrors this repo to the Hugging Face
# Space, which then rebuilds and goes live automatically.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions"
          # Build a clean deploy snapshot without repo history, then force-push it.
          git checkout --orphan hf-deploy
          git reset --mixed
          git add -A
          git commit -m "Deploy snapshot"
          git push --force "https://Sayak-Satpathi:${HF_TOKEN}@huggingface.co/spaces/Sayak-Satpathi/sakshya-demo" HEAD:main
