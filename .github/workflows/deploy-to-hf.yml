name: Deploy to Hugging Face Space

# Every push to main (and manual runs) mirrors this repo to the Hugging Face
# Space, which then rebuilds and goes live automatically.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions"
          # Mirror a filtered snapshot to avoid pushing oversized model binaries.
          DEPLOY_DIR="$(mktemp -d)"
          rsync -a --delete \
            --exclude=".git" \
            --exclude="models/*.onnx" \
            --exclude="models/*.pt" \
            --exclude="models/*.pth" \
            --exclude="models/*.caffemodel" \
            --exclude="models/*.pb" \
            --exclude="models/*.tflite" \
            --exclude="models/*.weights" \
            ./ "${DEPLOY_DIR}/"

          cd "${DEPLOY_DIR}"
          git init
          git checkout -b main
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add .
          git commit -m "Deploy snapshot ${GITHUB_SHA}"
          git push --force "https://Sayak-Satpathi:${HF_TOKEN}@huggingface.co/spaces/Sayak-Satpathi/sakshya-demo" main:main
